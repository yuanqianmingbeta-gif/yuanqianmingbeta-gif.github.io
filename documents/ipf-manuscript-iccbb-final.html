<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ICCBB Paper | Yuan Qianming</title>
  <link rel="stylesheet" href="/assets/index-4q1W9via.css">
  <style>
    body { padding: 1rem; }
    main { max-width: 76rem; margin: auto; }
    h1 { margin: 0 0 .5rem; font-size: clamp(1.25rem, 3vw, 1.75rem); }
    #download { display: inline-block; margin-bottom: .75rem; color: var(--color-accent-ink); }
    #download[hidden], #preview[hidden] { display: none; }
    #preview { display: block; width: 100%; min-height: 75vh; border: 1px solid var(--color-border); }
  </style>
</head>
<body>
  <main>
    <h1 id="heading">ICCBB Final Manuscript</h1>
    <p id="status" role="status">Loading the final manuscript…</p>
    <a id="download" download="IPF-Membrane-Anchor-ICCBB-Final.pdf" hidden>Download the PDF</a>
    <iframe id="preview" title="ICCBB Final Manuscript" hidden></iframe>
  </main>
  <script type="module">
    const chinese = localStorage.getItem("lang") === "cn";
    const heading = document.querySelector("#heading");
    const status = document.querySelector("#status");
    const download = document.querySelector("#download");
    const preview = document.querySelector("#preview");
    if (chinese) {
      document.documentElement.lang = "zh-CN";
      document.title = "ICCBB 论文终稿 | 袁千茗";
      heading.textContent = "ICCBB 论文终稿";
      status.textContent = "正在加载论文终稿…";
      download.textContent = "下载 PDF";
      preview.title = "ICCBB 论文终稿";
    }
    try {
      const chunks = await Promise.all(Array.from({ length: 6 }, async (_, index) => {
        const response = await fetch(`./ipf-iccbb-final/part-${index}.txt`);
        if (!response.ok) throw new Error(`PDF part ${index}: ${response.status}`);
        return Uint8Array.from(atob(await response.text()), character => character.charCodeAt(0));
      }));
      const pdf = new Blob(chunks, { type: "application/pdf" });
      if (pdf.size !== 7452562) throw new Error("Unexpected PDF size");
      const url = URL.createObjectURL(pdf);
      download.href = url;
      preview.src = url;
      download.hidden = false;
      preview.hidden = false;
      status.textContent = "";
    } catch {
      status.textContent = chinese ? "论文加载失败，请刷新页面重试。" : "The manuscript could not load. Please refresh the page to retry.";
    }
  </script>
</body>
</html>
